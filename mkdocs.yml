site_name: Python Security Suite
site_description: Offline-first security scanner orchestration and reporting for Python projects
site_url: https://willtran87.github.io/project-py-security-suite/
repo_name: willtran87/project-py-security-suite
repo_url: https://github.com/willtran87/project-py-security-suite
edit_uri: edit/main/docs/
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Overview: index.md
  - Architecture:
      - Solution design: design.md
      - Threat model: threat-model.md
      - Compatibility matrix: compatibility-matrix.md
      - Tool selection: tool-selection.md
      - Scanner lifecycle: tool-lifecycle.md
  - Analysis:
      - Advanced analysis: advanced-analysis.md
      - Risk paths: risk-paths.md
      - Reachability: reachability.md
      - Graphify integration: graphify.md
      - Evidence fusion: evidence-fusion.md
      - Structural synthesis: structural-synthesis.md
      - Data exposure: data-exposure.md
      - Detection effectiveness: effectiveness.md
  - Operations:
      - Operations guide: operations.md
      - Configuration: configuration.md
      - Production security: production-security.md
      - Companion assurance: companion-assurance.md
  - Governance:
      - Release readiness: release-readiness.md
      - Security Passport: security-passport.md
      - Product enhancement matrix: product-enhancement-matrix.md
      - Findings closure register: findings-closure.md
      - Findings enhancement plan: findings-enhancement-plan.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
extra_css:
  - stylesheets/extra.css

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
