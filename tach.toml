# Architectural contract for the suite itself. Keep dependencies explicit so
# reviews can distinguish intentional boundary changes from accidental coupling.
source_roots = ["src"]
root_module = "forbid"
exact = true
forbid_circular_dependencies = true
layers_explicit_depends_on = true
layers = ["entrypoints", "application", "integrations", "services", "core"]

[[modules]]
path = "py_security_suite"
depends_on = []
layer = "core"

[[modules]]
path = "py_security_suite.models"
depends_on = []
layer = "core"

[[modules]]
path = "py_security_suite.execution"
depends_on = []
layer = "core"

[[modules]]
path = "py_security_suite.path_safety"
depends_on = []
layer = "core"

[[modules]]
path = "py_security_suite.reachability"
depends_on = ["py_security_suite.path_safety"]
layer = "core"

[[modules]]
path = "py_security_suite.prioritization"
depends_on = []
layer = "core"

[[modules]]
path = "py_security_suite.config"
depends_on = ["py_security_suite.models", "py_security_suite.path_safety"]
layer = "services"

[[modules]]
path = "py_security_suite.inventory"
depends_on = ["py_security_suite.models"]
layer = "services"

[[modules]]
path = "py_security_suite.correlation"
