[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-security-suite"
version = "0.1.0"
description = "Offline-first security scanner orchestration and reporting for Python projects"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Python Security Suite contributors" }]
keywords = ["python", "security", "sast", "sbom", "offline", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=50,<51",
  "defusedxml>=0.7.1,<0.8",
  "jsonschema>=4.23,<5",
  "macholib>=1.16.4,<2",
  "pefile>=2024.8.26,<2025",
  "psutil>=7.2,<8",
  "pypdf>=5,<7",
  "pyelftools>=0.33,<0.34",
  "rfc8785>=0.1.4,<1",
  "rfc3161ng>=2.1.3,<3",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-c>=0.24,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.24",
  "tree-sitter-cpp>=0.23,<0.24",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-kotlin>=1.1,<1.2",
  "tree-sitter-php>=0.24,<0.25",
  "tree-sitter-ruby>=0.23,<0.24",
  "tree-sitter-rust>=0.24,<0.25",
  "tree-sitter-swift>=0.7,<0.8",
  "tree-sitter-typescript>=0.23,<0.24",
  "wasmtime>=47,<49",
]

[project.urls]
Documentation = "https://willtran87.github.io/project-py-security-suite/"
Issues = "https://github.com/willtran87/project-py-security-suite/issues"
Repository = "https://github.com/willtran87/project-py-security-suite"
Security = "https://github.com/willtran87/project-py-security-suite/security/policy"

[dependency-groups]
dev = [
  "atheris>=3.1,<4; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
  "coverage[toml]>=7.10,<8",
  "diff-cover>=10.2,<11",
  "hypothesis>=6.140,<7",
  "hypothesis-jsonschema>=0.23,<0.24",
  "mypy>=1.17,<3",
  "mutmut>=3.7,<4",
  "pip-audit>=2.9,<3",
  "pyfakefs>=5.9,<7",
  "pytest>=8.4,<10",
  "pytest-mock>=3.15,<4",
  "pytest-randomly>=4.0,<5",
  "pytest-socket>=0.7,<0.9",
  "pytest-subprocess>=1.5,<2",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
  "pyright==1.1.411",
  "responses>=0.25,<0.27",
  "respx>=0.22,<0.24",
  "ruff>=0.12,<1",
  "tach>=0.35,<0.36",
  "time-machine>=2.19,<4",
  "types-psutil>=7.2,<8",
  "tox>=4.30,<5",
  "zizmor>=1.28,<2",
]
[project.scripts]
py-security-suite = "py_security_suite.cli:main"
pysec = "py_security_suite.cli:main"
pysec-evidence = "py_security_suite.evidence_ingest:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py_security_suite = [
  "py.typed",
  "rules/*.ini",
  "rules/*.yaml",
  "rules/*.yml",
  "rules/*.toml",
  "rules/*.txt",
  "rules/*.psd1",
  "rules/*.json",
  "schemas/*.json",
]

[tool.pyright]
include = [
  "src/py_security_suite/atomic_file.py",
  "src/py_security_suite/application_contracts.py",
  "src/py_security_suite/attestation_formats.py",
  "src/py_security_suite/benchmark_input_validation.py",
  "src/py_security_suite/benchmark_semantic_evidence.py",
  "src/py_security_suite/bounded_subprocess.py",
  "src/py_security_suite/bytecode_analysis.py",
  "src/py_security_suite/bytecode_parser_worker.py",
  "src/py_security_suite/checkpoint_authority.py",
  "src/py_security_suite/diagnostic_safety.py",
  "src/py_security_suite/execution_policy.py",
  "src/py_security_suite/effectiveness_corpus.py",
  "src/py_security_suite/governance_replay.py",
  "src/py_security_suite/governance_quorum.py",
  "src/py_security_suite/git_replay.py",
  "src/py_security_suite/failure_domain.py",
  "src/py_security_suite/industry_extension_evidence.py",
  "src/py_security_suite/industry_assurance.py",
  "src/py_security_suite/isolation_probe.py",
  "src/py_security_suite/llm_adversarial.py",
  "src/py_security_suite/native_evidence.py",
  "src/py_security_suite/operational_trend.py",
  "src/py_security_suite/orchestrator.py",
  "src/py_security_suite/performance_assurance.py",
  "src/py_security_suite/path_safety.py",
  "src/py_security_suite/repository_file_policy.py",
  "src/py_security_suite/reports.py",
  "src/py_security_suite/requirements_coverage.py",
  "src/py_security_suite/release_readiness.py",
  "src/py_security_suite/risk_paths.py",
  "src/py_security_suite/standards_monitor.py",
  "src/py_security_suite/strict_json.py",
  "scripts/audit_github_assurance_controls.py",
  "scripts/extract_github_artifact.py",
  "scripts/generate_architecture_assurance.py",
  "scripts/generate_ci_assurance_metrics.py",
  "scripts/prepare_scanner_database.py",
  "scripts/run_mutation_assurance.py",
  "scripts/validate_architecture_cycles.py",
  "scripts/validate_architecture_limits.py",
  "scripts/validate_live_assurance_policy.py",
  "scripts/validate_live_test_results.py",
  "scripts/validate_performance_budgets.py",
  "scripts/validate_public_api.py",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportDeprecated = false
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.ruff.lint]
select = ["ASYNC", "B", "BLE", "C4", "E4", "E7", "E9", "F", "RUF021", "S", "UP035"]

[tool.ruff.lint.per-file-ignores]
"src/py_security_suite/source_context.py" = ["S105"]
"tests/**" = ["S101", "S105"]

[tool.coverage.run]
branch = true
source = ["py_security_suite"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false

[tool.mutmut]
source_paths = [
  "src/",
  "companion/__init__.py",
  "companion/strict_json.py",
]
only_mutate = [
  "src/py_security_suite/application_contracts.py",
  "src/py_security_suite/artifact_validation.py",
  "src/py_security_suite/architecture_history.py",
  "src/py_security_suite/benchmark_assurance.py",
  "src/py_security_suite/benchmark_adapter_conformance.py",
  "src/py_security_suite/benchmark_evidence.py",
  "src/py_security_suite/benchmark_execution.py",
  "src/py_security_suite/benchmark_input_validation.py",
  "src/py_security_suite/benchmark_pipeline.py",
  "src/py_security_suite/benchmark_receipt.py",
  "src/py_security_suite/benchmark_runtime.py",
  "src/py_security_suite/benchmark_signing.py",
  "src/py_security_suite/benchmark_semantic_evidence.py",
  "src/py_security_suite/benchmark_statistical_evidence.py",
  "src/py_security_suite/benchmark_telemetry.py",
  "src/py_security_suite/benchmark_scoring.py",
  "src/py_security_suite/bounded_subprocess.py",
  "src/py_security_suite/checkpoint_authority.py",
  "src/py_security_suite/execution_policy.py",
  "src/py_security_suite/failure_domain.py",
  "src/py_security_suite/git_replay.py",
  "src/py_security_suite/industry_benchmark_scoring.py",
  "src/py_security_suite/industry_extension_evidence.py",
  "src/py_security_suite/industry_receipt_trust.py",
  "src/py_security_suite/isolation_probe.py",
  "src/py_security_suite/native_parser_worker.py",
  "src/py_security_suite/organization_policy_attestation.py",
  "src/py_security_suite/operation_receipt.py",
  "src/py_security_suite/capability_manifest.py",
  "src/py_security_suite/code_health.py",
  "src/py_security_suite/confidential_archive.py",
  "src/py_security_suite/correlation.py",
  "src/py_security_suite/finding_validation.py",
  "src/py_security_suite/framework_coverage.py",
  "src/py_security_suite/path_safety.py",
  "src/py_security_suite/policy.py",
  "src/py_security_suite/risk_acceptance.py",
  "src/py_security_suite/release_readiness.py",
  "src/py_security_suite/runtime_reachability.py",
  "src/py_security_suite/strict_json.py",
  "src/py_security_suite/trust_attestation.py",
  "src/py_security_suite/trusted_time.py",
  "src/py_security_suite/trusted_observation.py",
  "src/py_security_suite/standards_monitor.py",
  "src/py_security_suite/static_architecture.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_strict_json.py",
  "tests/test_path_safety.py",
  "tests/test_artifact_validation.py",
  "tests/test_benchmark_execution.py",
  "tests/test_benchmark_assurance.py",
  "tests/test_benchmark_adapter_conformance.py",
  "tests/test_benchmark_evidence.py",
  "tests/test_benchmark_input_validation.py",
  "tests/test_benchmark_pipeline.py",
  "tests/test_benchmark_receipt.py",
  "tests/test_benchmark_signing.py",
  "tests/test_benchmark_semantic_evidence.py",
  "tests/test_semantic_calibration.py",
  "tests/test_benchmark_telemetry.py",
  "tests/test_benchmark_scoring.py",
  "tests/test_git_replay.py",
  "tests/resilience/test_assurance_resilience.py",
  "tests/test_security_trust_closure.py",
  "tests/test_isolation_probe.py",
  "tests/test_industry_benchmark_scoring.py",
  "tests/test_industry_extension_evidence.py",
  "tests/test_native_parser_worker.py",
  "tests/test_policy_attestations.py",
  "tests/test_trusted_time.py",
  "tests/test_standards_monitor.py",
  "tests/test_confidential_archive.py",
  "tests/test_analysis_accuracy.py",
  "tests/test_orchestrator.py",
  "tests/test_policy.py",
  "tests/test_risk_acceptance.py",
  "tests/test_reachability.py",
  "tests/test_release_readiness.py",
  "tests/test_trusted_observation.py",
]
pytest_add_cli_args = [
  "-p", "no:randomly",
  "-p", "no:tach",
  "--disable-socket",
  "-q",
]
mutate_only_covered_lines = true
do_not_mutate_patterns = [
  "src/py_security_suite/__init__.py",
  "src/py_security_suite/__main__.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
  "-p", "no:tach",
  "--disable-socket",
  "--strict-config",
  "--strict-markers",
]
timeout = 60
timeout_method = "thread"
markers = [
  "integration: exercises a real disposable browser or service runtime",
  "resilience: injects bounded infrastructure and process failures",
]
