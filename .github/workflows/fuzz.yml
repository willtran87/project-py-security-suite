name: Continuous parser fuzzing

on:
  pull_request:
    paths:
      - src/py_security_suite/**
      - scripts/fuzz_security_parsers.py
      - fuzz/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/fuzz.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-fuzz:
    name: Fuzz strict JSON, SARIF, and adapter parsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked fuzzing environment
        run: uv sync --locked --all-groups --python "3.13"
      - name: Run coverage-guided parser fuzzing
        run: >-
          uv run --frozen python scripts/fuzz_security_parsers.py
          -max_total_time=300
          -timeout=10
          -rss_limit_mb=2048
          -print_final_stats=1
          fuzz/corpus/security-parsers
      - name: Retain fuzz failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-fuzz-failures
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain evolved parser corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-fuzz-corpus-${{ github.run_id }}
          path: fuzz/corpus/security-parsers
          if-no-files-found: error
          retention-days: 14
