name: Release artifact assurance

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  independent-build:
    name: Independent builder ${{ matrix.builder }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: a
            runner: ubuntu-24.04
            platform: linux-x64-ubuntu-24.04
          - builder: b
            # Reproducibility compares the canonical Linux release artifact.
            # Windows portability is exercised independently by CI; its Python
            # metadata writer uses standards-equivalent CRLF serialization.
            runner: ubuntu-22.04
            platform: linux-x64-ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Exchange the workflow identity for provenance signing.
      attestations: write # Publish provenance for the exact builder subjects.
    env:
      RELEASE_BUILDER: ${{ matrix.builder }}
      RELEASE_BUILDER_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Install locked build environment
        run: uv sync --locked --all-groups --python "3.13"
      - name: Derive source epoch from checked-out commit
        shell: pwsh
        run: |
          "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYSEC_RELEASE_BUILDER_PLATFORM=$env:RELEASE_BUILDER_PLATFORM" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build distribution
        shell: pwsh
        run: |
          $releaseDirectory = ".artifacts/release-$env:RELEASE_BUILDER"
          uv build --no-sources --out-dir $releaseDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Distribution build failed"
          }
          $sdists = @(Get-ChildItem -LiteralPath $releaseDirectory -Filter "*.tar.gz")
          if ($sdists.Count -ne 1) {
            throw "Expected exactly one source distribution, found $($sdists.Count)"
          }
          uv run pysec normalize-sdist $sdists[0].FullName `
            --output $sdists[0].FullName `
            --source-date-epoch ([int64]$env:SOURCE_DATE_EPOCH) `
            --overwrite `
            --format json
          if ($LASTEXITCODE -ne 0) {
            throw "Source distribution normalization failed"
          }
      - name: Attest exact builder subjects
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: .artifacts/release-${{ matrix.builder }}/*
      - name: Retain independent builder output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-builder-${{ matrix.builder }}
          path: .artifacts/release-${{ matrix.builder }}
          if-no-files-found: error

  compare-and-exercise:
    name: Compare independent builds and exercise exact wheel
    needs: independent-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Verify source and builder provenance against this repository.
      attestations: read # Download and verify both builder attestations.
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: false
      - name: Install locked verification environment
        run: uv sync --locked --all-groups --python "3.13"
      - name: Download builder A
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-builder-a
          path: .artifacts/release-a
      - name: Download builder B
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-builder-b
          path: .artifacts/release-b
      - name: Verify both builder provenance envelopes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in .artifacts/release-a/* .artifacts/release-b/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-assurance.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF"
          done
      - name: Require byte-for-byte reproducibility
        run: >-
          uv run pysec compare-builds .artifacts/release-a .artifacts/release-b
          --format json --output .artifacts/reproducible-build.json
      - name: Create a closed dependency wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/wheelhouse
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip download --require-hashes --requirement "$RUNNER_TEMP/runtime-requirements.txt" --dest .artifacts/wheelhouse
          cp .artifacts/release-a/*.whl .artifacts/wheelhouse/
      - name: Install and exercise the exact wheel offline
        shell: pwsh
        run: >-
          ./scripts/test-wheel-offline.ps1
          -Wheel (Get-ChildItem .artifacts/release-a/*.whl).FullName
          -Wheelhouse .artifacts/wheelhouse
          -Python python
      - name: Retain compared release and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            .artifacts/release-a
            .artifacts/reproducible-build.json
          if-no-files-found: error
