name: Deep security assurance

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/deep-assurance.yml"
      - "containers/scanner/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  end-to-end-self-scan:
    name: End-to-end scanner self-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Exchange trusted workflow identity for provenance signing.
      attestations: write # Publish provenance for the exact scanner evidence subjects.
    env:
      SELF_SCAN_IMAGE: pysec-self-scan:${{ github.sha }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned database preparation runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Acquire and seal the exact OSV database build input
        run: >-
          python -I scripts/prepare_scanner_database.py
          --output .artifacts/deep-self-scan-inputs/osv-pypi
      - name: Build the pinned offline scanner image
        shell: pwsh
        run: >-
          ./scripts/build-scanner-image.ps1
          -Tag $env:SELF_SCAN_IMAGE
          -OsvDatabaseDirectory .artifacts/deep-self-scan-inputs/osv-pypi
          -EvidenceDirectory .artifacts/deep-self-scan-image
      - name: Attest the exact scanner image evidence
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .artifacts/deep-self-scan-image/*
      - name: Scan the complete repository through the production container boundary
        shell: pwsh
        run: >-
          ./scripts/run-self-scan.ps1
          -Image $env:SELF_SCAN_IMAGE
          -ReportName deep-self-scan
      - name: Retain the sealed self-scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-self-scan-${{ github.sha }}
          path: .artifacts/deep-self-scan
          if-no-files-found: error
          retention-days: 180
      - name: Retain the sealed scanner input receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-self-scan-inputs-${{ github.sha }}
          path: |
            .artifacts/deep-self-scan-inputs/osv-pypi/metadata.json
            .artifacts/deep-self-scan-inputs/osv-pypi/osv-pypi-all.zip.sha256
          if-no-files-found: error
          retention-days: 180
      - name: Retain scanner image identity and SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-self-scan-image-${{ github.sha }}
          path: .artifacts/deep-self-scan-image
          if-no-files-found: error
          retention-days: 180

  mutation-assurance:
    name: Security-critical mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked mutation environment
        run: uv sync --locked --all-groups --python "3.13"
      - name: Require every covered security-critical mutant to be killed
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python scripts/run_mutation_assurance.py --max-children 8
          mkdir -p .artifacts/mutation
          uv run --frozen mutmut junitxml \
            --suspicious-policy=failure --untested-policy=failure \
            > .artifacts/mutation/mutmut.xml
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-assurance-${{ github.sha }}
          path: |
            .artifacts/mutation
            mutants/mutmut-stats.json
          if-no-files-found: warn
          retention-days: 180

  required-gate:
    name: Deep assurance required gate
    if: always()
    needs: [end-to-end-self-scan, mutation-assurance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require every deep-assurance lane to pass
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
