name: Deep security assurance

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/deep-assurance.yml"
      - "containers/scanner/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-assurance-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR evidence has no admission value. Scheduled and main-branch
  # evidence remains non-cancellable so retained assurance cannot be truncated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  end-to-end-self-scan:
    name: End-to-end scanner self-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Exchange trusted workflow identity for provenance signing.
      attestations: write # Publish provenance for the exact scanner evidence subjects.
    env:
      SELF_SCAN_IMAGE: pysec-self-scan:${{ github.sha }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned database preparation runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Acquire and seal the exact OSV database build input
        run: >-
          python -I scripts/prepare_scanner_database.py
          --output .artifacts/deep-self-scan-inputs/osv-pypi
      - name: Build the pinned offline scanner image
        shell: pwsh
        run: >-
          ./scripts/build-scanner-image.ps1
          -Tag $env:SELF_SCAN_IMAGE
          -OsvDatabaseDirectory .artifacts/deep-self-scan-inputs/osv-pypi
          -EvidenceDirectory .artifacts/deep-self-scan-image
      - name: Attest the exact scanner image evidence
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .artifacts/deep-self-scan-image/*
      - name: Scan the complete repository through the production container boundary
        shell: pwsh
        run: >-
          ./scripts/run-self-scan.ps1
          -Image $env:SELF_SCAN_IMAGE
          -ReportName deep-self-scan
      - name: Retain the sealed self-scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-self-scan-${{ github.sha }}
          path: .artifacts/deep-self-scan
          if-no-files-found: error
          retention-days: 90
      - name: Retain the sealed scanner input receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-self-scan-inputs-${{ github.sha }}
          path: |
            .artifacts/deep-self-scan-inputs/osv-pypi/metadata.json
            .artifacts/deep-self-scan-inputs/osv-pypi/osv-pypi-all.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Retain scanner image identity and SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-self-scan-image-${{ github.sha }}
          path: .artifacts/deep-self-scan-image
          if-no-files-found: error
          retention-days: 90

  mutation-assurance:
    name: Security-critical mutation testing (zero-based shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    # Large shards can exceed 45 minutes on shared hosted runners. Keep all
    # mutants and score requirements, with a bounded completion allowance.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked mutation environment
        run: uv sync --locked --all-groups --python "3.13"
      - name: Run the bounded security-critical mutation shard
        shell: bash
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          uv run --frozen python scripts/run_mutation_assurance.py \
            --shard-index "$MUTATION_SHARD" --shard-count 6 \
            --max-children 8
          mkdir -p ".artifacts/mutation/shard-$MUTATION_SHARD"
          uv run --frozen mutmut export-cicd-stats
          uv run --frozen python scripts/validate_mutation_assurance.py \
            --stats mutants/mutmut-cicd-stats.json \
            --minimum-score 0 \
            --shard "$MUTATION_SHARD" \
            --junit-output ".artifacts/mutation/shard-$MUTATION_SHARD/mutmut.xml" \
            --output ".artifacts/mutation/shard-$MUTATION_SHARD/assurance.json"
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-assurance-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            .artifacts/mutation/shard-${{ matrix.shard }}
            mutants/mutmut-stats.json
            mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
          retention-days: 90

  mutation-aggregate:
    name: Mutation assurance aggregate
    needs: mutation-assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the evidence validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned validation runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download every disjoint mutation shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-assurance-${{ github.sha }}-shard-*
          path: .artifacts/mutation-shards
      - name: Enforce the aggregate mutation-score ratchet
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t stats < <(find .artifacts/mutation-shards -type f -name mutmut-cicd-stats.json | sort)
          if [[ "${#stats[@]}" -ne 6 ]]; then
            echo "expected 6 mutation shard summaries; observed ${#stats[@]}" >&2
            exit 1
          fi
          arguments=()
          for path in "${stats[@]}"; do
            arguments+=(--stats "$path")
          done
          python -I scripts/validate_mutation_assurance.py \
            "${arguments[@]}" \
            --minimum-score 70 \
            --shard aggregate-6 \
            --junit-output .artifacts/mutation-aggregate/mutmut.xml \
            --output .artifacts/mutation-aggregate/assurance.json
      - name: Retain aggregate mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-assurance-${{ github.sha }}-aggregate
          path: .artifacts/mutation-aggregate
          if-no-files-found: error
          retention-days: 90

  required-gate:
    name: Deep assurance required gate
    if: always()
    needs: [end-to-end-self-scan, mutation-aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require every deep-assurance lane to pass
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
