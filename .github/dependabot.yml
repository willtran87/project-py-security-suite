version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  # uv-managed projects: Dependabot updates pyproject.toml and uv.lock together
  # so locked versions (not only manifests) receive version updates.
  - package-ecosystem: uv
    directory: /
    groups:
      root-python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /companion
    groups:
      companion-python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  # After a scanner update, regenerate containers/scanner/requirements.lock and
  # build-requirements.lock with `uv export` (CI rejects a stale export).
  - package-ecosystem: uv
    directory: /containers/scanner
    groups:
      scanner-python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /containers/scanner
    groups:
      scanner-image:
        patterns: ["*"]
    ignore:
      # containers/scanner/pyproject.toml requires Python >=3.11,<3.14; newer
      # interpreters break the locked native wheels (for example cffi).
      - dependency-name: python
        versions: [">=3.14"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docs
    groups:
      documentation-python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
