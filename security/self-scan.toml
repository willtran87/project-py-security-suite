schema_version = "1"
profile = "standard"

[isolation]
network = "deny"
require_attestation = true
execute_target_code = false

[execution]
max_workers = 1
max_output_bytes = 33554432

[policy]
required_scanners = ["bandit", "semgrep", "detect-secrets", "osv-scanner"]
block_severities = ["critical", "high"]
incomplete_is_blocking = true
# Governed acceptance of exactly the eight Semgrep-pinned scanner-image
# advisories (mcp, opentelemetry-api, wcmatch); expires 2027-01-26. See
# docs/compatibility-matrix.md. Any edit to the ledger must update this digest.
risk_acceptance_path = "/workspace/security/self-scan-risk-acceptances.json"
risk_acceptance_sha256 = "fb190c8686d8818ef2bdca653161e407f1258606f100440ea156e107e835f5e7" # pragma: allowlist secret - public ledger checksum

[reports]
include_sanitized_evidence = true

[tools.bandit]
enabled = true
executable = "/usr/local/bin/bandit"
timeout_seconds = 300

[tools.semgrep]
enabled = true
executable = "/usr/local/bin/semgrep"
timeout_seconds = 600
rules_path = "/opt/pysec-suite/rules/python-security.yml"

[tools.detect-secrets]
rules_path = "/workspace/security/self-scan-public-digests.json"
rules_sha256 = "dcd07f9c766bf4581b60d3350fdb67f65a90ffe42437bd44f6c34fcd6a2bc692" # pragma: allowlist secret - public policy checksum
enabled = true
executable = "/usr/local/bin/detect-secrets"
timeout_seconds = 300

[tools.osv-scanner]
enabled = true
executable = "/usr/local/bin/osv-scanner"
timeout_seconds = 300
database_path = "/opt/osv-db"
