[project]
name = "py-security-suite-companion"
version = "0.1.0"
description = "Locked Linux companion controls for Python Security Suite"
requires-python = ">=3.11,<3.14"
dependencies = [
  "atheris>=3,<4",
  "check-manifest>=0.51,<1",
  "crosshair-tool>=0.0.95,<1",
  "hypothesis>=6.140,<7",
  "hypothesis-jsonschema>=0.23,<0.24",
  "in-toto>=3,<4",
  "mutmut>=3,<4",
  "pytm>=1.3,<2",
  "schemathesis>=4,<5",
  "yara-python>=4.5,<5",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "pytest>=8.4,<10",
  "pytest-socket>=0.7,<0.8",
  "pytest-timeout>=2.4,<3",
  "tox>=4.30,<5",
]

[tool.uv]
package = false
