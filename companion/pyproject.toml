[project]
name = "py-security-suite-companion"
version = "0.1.0"
description = "Locked Linux companion controls for Python Security Suite"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiokafka>=0.12,<1",
  "boofuzz>=0.4,<1",
  "check-manifest>=0.51,<1",
  "crosshair-tool>=0.0.95,<1",
  "ddtrace>=4,<5",
  "hypothesis>=6.140,<7",
  "hypothesis-jsonschema>=0.23,<0.24",
  "grpcio>=1.75,<2",
  "in-toto>=3,<4",
  "jsonschema>=4.23,<5",
  "mutmut>=3,<4",
  "pytm>=1.3,<2",
  "playwright>=1.55,<2",
  "py-security-suite",
  "psycopg[binary]>=3.2,<4",
  "pytest-playwright>=0.7,<1",
  "rfc8785>=0.1.4,<1",
  "rfc3161ng>=2.1.3,<3",
  "schemathesis>=4,<5",
  "websockets>=15,<17",
  "yara-python>=4.5,<5",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "pytest>=8.4,<10",
  "pytest-socket>=0.7,<0.8",
  "pytest-timeout>=2.4,<3",
  "tox>=4.30,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
py-security-suite = { path = "..", editable = true }
