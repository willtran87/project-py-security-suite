schema_version = "1"
# quick | standard | extended | deep | supply-chain | artifact | quality |
# repo | iac-deep | governance | comprehensive | production | release
profile = "standard"

[paths]
# `@bundle/...` references resolve beneath this root without environment expansion.
bundle_root = ".pysec-tools"

[isolation]
network = "deny"
enforcement_mode = "external-attested"
require_attestation = true
require_evidence = false
execute_target_code = false
# Production and release force require_evidence = true. Put these bindings in
# the organization policy—not repository config—to establish authorization.
# evidence_path = "security-data/isolation-attestation.json"
# evidence_sha256 = "<organization-approved-attestation-sha256>"
# evidence_public_key_path = "security-data/governance-ed25519.pem"
# evidence_public_key_sha256 = "<organization-approved-key-sha256>"
# evidence_signature_path = "security-data/isolation-attestation.sig"
# Governance v2 production evidence also requires a unique replay ledger.
# replay_ledger_path = "security-data/isolation-replay.sqlite3"
# To enforce locally, select sandbox-launcher and configure an approved command
# prefix whose final arguments introduce the scanner command (for example `--`).
# enforcement_mode = "sandbox-launcher"
# sandbox_executable = "/usr/bin/bwrap"
# sandbox_executable_sha256 = "<organization-approved-launcher-sha256>"
# sandbox_runtime_closure_sha256 = "<launcher-and-transitive-native-closure-sha256>"
# sandbox_arguments = ["--unshare-net", "--die-with-parent", "--"]
# The external boundary must attest resource-limits and file-write-quota for
# production/release; local scratch polling is diagnostic, not a hard quota.

[execution]
max_workers = 4
max_output_bytes = 16777216

[policy]
# Empty means every selected and applicable scanner is required.
required_scanners = []
block_severities = ["critical", "high"]
incomplete_is_blocking = true
# Optional, bounded acceptance ledger. Production policy should pin its digest.
# risk_acceptance_path = "security/risk-acceptances.json"
# risk_acceptance_sha256 = "<organization-approved-ledger-sha256>"

[reports]
include_sanitized_evidence = true
classification = "confidential"
retention_days = 30
# Optional prior findings report for new/existing/regressed/resolved analysis.
# Both values are required together; organization policy should pin the digest.
# baseline_path = "security-data/previous/findings.json"
# baseline_sha256 = "<organization-approved-baseline-sha256>"

[intelligence]
# Snapshots are acquired in the connected lane and consumed without network access.
# Every configured snapshot requires its organization-approved SHA-256.
# kev_path = "security-data/intelligence/known_exploited_vulnerabilities.json"
# kev_sha256 = "<organization-approved-kev-sha256>"
# epss_path = "security-data/intelligence/epss_scores-current.csv.gz"
# epss_sha256 = "<organization-approved-epss-sha256>"
# vex_path = "security-data/intelligence/product-vex.cdx.json"
# vex_sha256 = "<organization-approved-vex-sha256>"
# Production and release require an organization-policy-bound approval manifest
# whenever any snapshot above is consumed.
# approval_path = "security-data/intelligence/approval.json"
# approval_sha256 = "<organization-approved-approval-sha256>"
# approval_public_key_path = "security-data/governance-ed25519.pem"
# approval_public_key_sha256 = "<organization-approved-key-sha256>"
# approval_signature_path = "security-data/intelligence/approval.sig"
# replay_ledger_path = "security-data/intelligence-replay.sqlite3"
require_approval = false
maximum_age_days = 3
epss_high_probability = 0.10
epss_high_percentile = 0.90

[trust]
# Optional organization-approved scanner catalog. Both values are required.
# The catalog binds tool/role digests to version, provenance source, approver,
# platform, and expiry. Repository config cannot replace the approved digest.
# catalog_path = "security-data/scanner-trust.json"
# catalog_sha256 = "<organization-approved-catalog-sha256>"
# Production/release authenticate the exact frozen environment snapshot through
# a quorum-signed, expiring policy and consume it exactly once.
# policy_path = "security-data/execution-trust-policy.json"
# policy_sha256 = "<organization-approved-policy-attestation-sha256>"
# replay_ledger_path = "security-data/trust-policy-replay.sqlite3"

[tools.bandit]
enabled = true
executable = "bandit"
# Set every applicable tool entry point to its organization-approved SHA-256.
# Production and release profiles fail closed when this binding is absent.
# executable_sha256 = "<organization-approved-sha256>"
# Python console scripts may additionally pin the recursively installed runtime.
# runtime_closure_sha256 = "<organization-approved-runtime-closure-sha256>"
# Native scanners with dynamically loaded plugins outside the executable tree
# declare exact relative paths and digests in SCANNER.runtime-closure.json.
timeout_seconds = 300

[tools.semgrep]
enabled = true
executable = "semgrep"
timeout_seconds = 600
# Point this at an enterprise-approved, immutable rule bundle.
rules_path = "security-rules/semgrep"

[tools.detect-secrets]
enabled = true
executable = "detect-secrets"
timeout_seconds = 300

[tools.osv-scanner]
enabled = true
executable = "osv-scanner"
timeout_seconds = 300
# Populate this directory in the connected update lane.
database_path = "security-data/osv"
maximum_database_age_days = 10

[tools.cyclonedx-py]
enabled = true
executable = "cyclonedx-py"
# Required when uv.lock is selected. Stage and hash uv in the offline bundle.
auxiliary_executable = "uv"
# auxiliary_executable_sha256 = "<organization-approved-uv-sha256>"
timeout_seconds = 300

[tools.ruff]
enabled = true
executable = "ruff"
timeout_seconds = 300

[tools.ruff-quality]
enabled = true
executable = "ruff"
timeout_seconds = 300

[tools.ruff-format]
enabled = true
executable = "ruff"
timeout_seconds = 300

[tools.pylint]
enabled = true
executable = "pylint"
timeout_seconds = 600
# The default is a suite-controlled policy; point this at an approved override
# only when the organization intentionally owns the policy lifecycle.
# rules_path = "security-rules/pylint.ini"

[tools.mypy]
enabled = true
executable = "mypy"
timeout_seconds = 600

[tools.pyright]
enabled = true
# Use the pinned Node.js executable and staged Pyright CLI.
executable = "node"
database_path = "security-tools/pyright/index.js"
rules_path = "security-tools/rules/pyrightconfig.json"
timeout_seconds = 600

[tools.deptry]
enabled = true
executable = "deptry"
timeout_seconds = 600

[tools.vulture]
enabled = true
executable = "vulture"
timeout_seconds = 300

[tools.tach]
enabled = true
executable = "tach"
timeout_seconds = 300

[tools.radon]
enabled = true
executable = "radon"
timeout_seconds = 300

[tools.reachability]
enabled = true
# This is the suite's own AST-only analyzer; it never imports target modules.
executable = "pysec"
timeout_seconds = 600
minimum_island_loc = 100
discover_framework_roots = true
# Optional roots for plugin, reflection, dependency-injection, or library APIs.
# entry_points = ["package.plugin:activate", "package.public:Client"]
# Optional target-relative roots override package-layout discovery.
# source_roots = ["src"]
# Optional coverage.py JSON corroborates static states without executing target code.
# coverage_path = ".artifacts/test-evidence/coverage.json"

[tools.coverage]
enabled = true
executable = "pysec-evidence"
timeout_seconds = 60
artifacts_path = "coverage.json"
minimum_coverage_percent = 80.0

[tools.junit]
enabled = true
executable = "pysec-evidence"
timeout_seconds = 60
artifacts_path = "junit.xml"

# Property tests execute only in a disposable companion lane. For Python
# projects the production profile fails closed when this evidence is absent.
[tools.hypothesis]
enabled = true
executable = "pysec-evidence"
timeout_seconds = 60
artifacts_path = "hypothesis-junit.xml"

# Applicable when the repository contains an OpenAPI schema.
[tools.schemathesis]
enabled = true
executable = "pysec-evidence"
timeout_seconds = 60
artifacts_path = "schemathesis-junit.xml"

[tools.diff-cover]
enabled = true
executable = "diff-cover"
timeout_seconds = 300
artifacts_path = "coverage.xml"
minimum_coverage_percent = 80.0
compare_branch = "origin/main"

[tools.psscriptanalyzer]
enabled = true
executable = "powershell.exe"
timeout_seconds = 600
rules_path = "security-rules/psscriptanalyzer.psd1"
# Directory containing the staged PSScriptAnalyzer module.
database_path = "security-tools/powershell-modules"

[tools.shellcheck]
enabled = true
executable = "shellcheck"
timeout_seconds = 300

[tools.zizmor]
enabled = true
executable = "zizmor"
timeout_seconds = 300

[tools.actionlint]
enabled = true
executable = "actionlint"
timeout_seconds = 300

[tools.hadolint]
enabled = true
executable = "hadolint"
timeout_seconds = 300

[tools.pysa]
enabled = true
executable = "pyre"
timeout_seconds = 1200

[tools.trivy]
enabled = true
executable = "trivy"
timeout_seconds = 900
# Optional local cache containing organization-approved Trivy assets.
database_path = "security-data/trivy"

[tools.checkov]
enabled = true
executable = "checkov"
timeout_seconds = 1200

[tools.guarddog]
enabled = true
executable = "guarddog"
timeout_seconds = 900

[tools.scancode]
enabled = true
executable = "scancode"
timeout_seconds = 1800

[tools.reuse]
enabled = true
executable = "reuse"
timeout_seconds = 600

[tools.gitleaks]
enabled = true
executable = "gitleaks"
timeout_seconds = 900
# Optional organization configuration. The bundled default rules are extended
# automatically when this setting is omitted.
# rules_path = "security-rules/gitleaks.toml"

[tools.trufflehog]
enabled = true
executable = "trufflehog"
timeout_seconds = 900

[tools.devskim]
enabled = true
executable = "devskim"
timeout_seconds = 900

[tools.flawfinder]
enabled = true
executable = "flawfinder"
timeout_seconds = 600

[tools.codeql]
enabled = true
executable = "run-codeql"
timeout_seconds = 1800
# run-codeql is allowed to use only this pre-staged CodeQL executable.
auxiliary_executable = "security-tools/codeql/codeql"
# Bind the CodeQL CLI separately from the run-codeql wrapper.
# auxiliary_executable_sha256 = "<organization-approved-codeql-sha256>"
# Isolated home containing .codeql/packages/codeql/python-queries.
database_path = "security-data/run-codeql-home"

[tools.syft]
enabled = true
executable = "syft"
timeout_seconds = 600
artifacts_path = "dist"

[tools.grype]
enabled = true
executable = "grype"
timeout_seconds = 900
database_path = "security-data/grype"
artifacts_path = "dist"

[tools.check-wheel-contents]
enabled = true
executable = "check-wheel-contents"
timeout_seconds = 300
artifacts_path = "dist"

[tools.twine]
enabled = true
executable = "twine"
timeout_seconds = 300
artifacts_path = "dist"

[tools.pypi-attestations]
enabled = true
executable = "pypi-attestations"
timeout_seconds = 300
artifacts_path = "dist"
provenance_path = "dist"
database_path = "security-data/sigstore-trust-home"
repository_url = "https://github.com/example/example"

[tools.cosign]
enabled = true
executable = "cosign"
timeout_seconds = 300
artifacts_path = "dist"
provenance_path = "dist"
# Choose public-key verification:
# public_key_path = "security-data/release-signing.pub"
# public_keyring_path = "security-data/evidence-keyring.json"
# public_keyring_sha256 = "replace-with-lowercase-sha256"
# replay_service_url = "https://replay.security.example/v1/consume"
# replay_service_token_env = "PYSEC_REPLAY_SERVICE_TOKEN"
# replay_service_ca_path = "security-data/replay-service-ca.pem"
# replay_service_ca_sha256 = "replace-with-lowercase-sha256"
# replay_service_receipt_key_path = "security-data/replay-receipt.pub.pem"
# replay_service_receipt_key_sha256 = "replace-with-lowercase-sha256"
# replay_service_client_cert_path = "security-data/replay-client.pem"
# replay_service_client_cert_sha256 = "replace-with-lowercase-sha256"
# replay_service_client_key_path = "security-data/replay-client.key"
# replay_service_client_key_sha256 = "replace-with-lowercase-sha256"
# allowed_builder_ids = ["https://github.com/example/builders/release@v1"]
# expected_build_type = "https://slsa.dev/build-type/v1"
# expected_source_repository = "https://github.com/example/repository"
# public_key_sha256 = "approved-public-key-sha256"
# Or keyless verification with all three settings:
# database_path = "security-data/sigstore-trusted-root.json"
# certificate_identity = "https://github.com/org/repo/.github/workflows/release.yml@refs/heads/main"
# certificate_oidc_issuer = "https://token.actions.githubusercontent.com"

[tools.scorecard]
enabled = true
executable = "pysec-evidence"
timeout_seconds = 60
# Generated only in the separately authorized connected governance lane.
artifacts_path = "scorecard.json"

[tools.conftest]
enabled = true
executable = "conftest"
timeout_seconds = 600
# Approved, locally staged OPA/Rego policy; remote policy pulls are never used.
rules_path = "security-rules/conftest"

[tools.kics]
enabled = true
executable = "kics"
timeout_seconds = 1200
# KICS must be built/staged with its matching local assets/queries tree.
rules_path = "security-data/kics/queries"

[tools.pipdeptree]
enabled = true
executable = "pipdeptree"
timeout_seconds = 300
# Python from the approved, already-created target runtime environment.
auxiliary_executable = ".venv/Scripts/python.exe"

[tools.git-sizer]
enabled = true
