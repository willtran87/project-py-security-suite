rules:
  - id: python.weak-cryptographic-hash
    languages: [python]
    message: MD5 and SHA-1 do not provide collision-resistant cryptographic hashing.
    severity: WARNING
    metadata:
      pysec_rule_id: python.weak-cryptographic-hash
      cwe: ["CWE-328: Use of Weak Hash"]
      category: cryptography
      confidence: HIGH
      remediation: Use a modern collision-resistant hash for integrity or a dedicated password-hashing algorithm for passwords. Explicit non-security checksums should use usedforsecurity=False.
      source: https://docs.python.org/3/library/hashlib.html
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - patterns:
              - pattern-either:
                  - pattern: hashlib.new($ALGORITHM, ...)
                  - pattern: hashlib.new(name=$ALGORITHM, ...)
              - metavariable-regex:
                  metavariable: $ALGORITHM
                  regex: (?i)^['"](?:md[245]|sha-?1)['"]$
      - pattern-not: hashlib.$FUNCTION(..., usedforsecurity=False, ...)

  - id: python.response-cookie-insecure
    languages: [python]
    message: This HTTP response explicitly creates a cookie without the Secure attribute.
    severity: WARNING
    metadata:
      pysec_rule_id: python.response-cookie-insecure
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without Secure Attribute"]
      category: transport-security
      confidence: MEDIUM
      remediation: Set secure=True for cookies sent over HTTPS, particularly session or authentication cookies. Review cookie sensitivity and the deployment's transport requirements.
      source: https://flask.palletsprojects.com/en/stable/web-security/
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: flask.make_response(...)
              - pattern: flask.Response(...)
              - pattern: django.http.HttpResponse(...)
              - pattern: starlette.responses.Response(...)
              - pattern: starlette.responses.JSONResponse(...)
              - pattern: fastapi.responses.Response(...)
              - pattern: fastapi.responses.JSONResponse(...)
        exact: true
    pattern-sinks:
      - patterns:
          - pattern: $RESPONSE.set_cookie(..., secure=False, ...)
          - focus-metavariable: $RESPONSE

  - id: python.grpc-insecure-channel
    languages: [python]
    message: gRPC insecure_channel provides neither transport encryption nor peer authentication.
    severity: ERROR
    metadata:
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      category: rpc-security
      confidence: HIGH
      pysec_rule_id: python.grpc-insecure-channel
      impact: RPC metadata and message content can be observed or modified, and the client cannot authenticate the server.
      remediation: Use grpc.secure_channel with organization-approved TLS credentials and verify the expected server identity.
      source: https://grpc.io/docs/guides/auth/
    pattern: grpc.insecure_channel(...)

  - id: python.psycopg-sql-composition
    languages: [python]
    message: SQL text is dynamically composed before Psycopg execution.
    severity: ERROR
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      category: database-security
      confidence: HIGH
      pysec_rule_id: python.psycopg-sql-composition
      impact: Attacker-controlled values can alter the intended SQL statement and read or modify data outside the authorized operation.
      remediation: Pass values as execute parameters and use psycopg.sql.Identifier or psycopg.sql.SQL only for allowlisted structural identifiers.
      source: https://www.psycopg.org/psycopg3/docs/basic/params.html
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute($QUERY % $VALUES, ...)
          - pattern: $CURSOR.execute($QUERY.format(...), ...)
          - pattern: $CURSOR.execute(f"...{$VALUE}...", ...)
          - pattern: $CURSOR.execute(f'...{$VALUE}...', ...)
      # Psycopg's composable objects quote identifiers/literals themselves.
      # Keep the template literal and every supported operand explicit: raw SQL
      # operands and unknown composition shapes must still be reviewed.
      - pattern-not: $CURSOR.execute(psycopg.sql.SQL("...").format(psycopg.sql.Identifier(...)), ...)
      - pattern-not: $CURSOR.execute(psycopg.sql.SQL("...").format(psycopg.sql.Literal(...)), ...)
      - pattern-not: $CURSOR.execute(psycopg.sql.SQL("...").format(psycopg.sql.Identifier(...), psycopg.sql.Literal(...)), ...)
      - pattern-not: $CURSOR.execute(psycopg.sql.SQL("...").format(psycopg.sql.Identifier(...), psycopg.sql.Identifier(...)), ...)
      - pattern-not: $CURSOR.execute(psycopg.sql.SQL("...").format(psycopg.sql.Identifier(...), psycopg.sql.Identifier(...), psycopg.sql.Identifier(...)), ...)

  - id: python.subprocess-shell-true
    languages: [python]
    message: Avoid shell=True with subprocess APIs; pass an argument vector instead.
    severity: ERROR
    metadata:
      pysec_rule_id: python.subprocess-shell-true
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: $OBJ.$FUNC(..., shell=True, ...)

  - id: python.unsafe-yaml-load
    languages: [python]
    message: Use yaml.safe_load for untrusted YAML input.
    severity: ERROR
    metadata:
      pysec_rule_id: python.unsafe-yaml-load
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      category: security
      confidence: HIGH
    pattern: yaml.load(...)

  - id: python.dynamic-code-execution
    languages: [python]
    message: Dynamic code execution can allow attacker-controlled input to run.
    severity: WARNING
    metadata:
      pysec_rule_id: python.dynamic-code-execution
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]
      category: security
      confidence: MEDIUM
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: python.sensitive-data-to-log
    languages: [python]
    mode: taint
    message: Sensitive data from a credential-bearing source may reach a log sink.
    severity: ERROR
    metadata:
      pysec_rule_id: python.sensitive-data-to-log
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      category: data-exposure
      confidence: HIGH
      impact: Logs commonly have broader access, replication, retention, and third-party transport than the source data; credential disclosure can enable account or service compromise.
      remediation: Remove the field or apply an approved redaction, masking, or tokenization boundary before logging; test exception and structured-log serialization with synthetic canary values.
      source: https://cwe.mitre.org/data/definitions/532.html
    pattern-sources:
      - patterns:
          - pattern: os.getenv($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - patterns:
          - pattern: os.environ[$KEY]
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - patterns:
          - pattern: os.environ.get($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - patterns:
          - pattern: $REQUEST.headers.get($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:authorization|cookie|credential|password|secret|session|token).*
      - pattern: $REQUEST.cookies.get(...)
      - patterns:
          - pattern: $OBJECT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?:api_key|auth_token|authorization|connection_string|cookie|credential|database_url|dsn|encryption_key|otp|passcode|password|passwd|pin|private_key|secret|session|token)$
      - patterns:
          - pattern-either:
              - pattern: $OBJECT[$KEY]
              - pattern: $OBJECT.get($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - pattern: $CLIENT.get_secret_value(...)
      - pattern: $CLIENT.access_secret_version(...)
    pattern-propagators:
      - pattern: $TO = $FROM
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL(..., $DATA, ...)
              - pattern: logger.$LEVEL(..., $DATA, ...)
              - pattern: log.$LEVEL(..., $DATA, ...)
              - pattern: loguru.logger.$LEVEL(..., $DATA, ...)
              - pattern: structlog.get_logger(...).$LEVEL(..., $DATA, ...)
          - focus-metavariable: $DATA
          - metavariable-regex:
              metavariable: $LEVEL
              regex: (?:critical|debug|error|exception|info|log|warn|warning)
      - patterns:
          - pattern: print(..., $DATA, ...)
          - focus-metavariable: $DATA
      - patterns:
          - pattern-either:
              - pattern: logging.LoggerAdapter(..., $DATA, ...)
              - pattern: $LOGGER.bind(..., $DATA, ...)
              - pattern: sys.stdout.write($DATA)
              - pattern: sys.stderr.write($DATA)
          - focus-metavariable: $DATA

  - id: python.sensitive-data-to-telemetry
    languages: [python]
    mode: taint
    message: Sensitive data from a credential-bearing source may reach telemetry or analytics.
    severity: ERROR
    metadata:
      pysec_rule_id: python.sensitive-data-to-telemetry
      cwe:
        - "CWE-201: Insertion of Sensitive Information Into Sent Data"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      category: data-exposure
      confidence: HIGH
      impact: Telemetry is often exported across trust boundaries and retained by multiple systems; secrets or personal data may become accessible to unintended operators or vendors.
      remediation: Minimize telemetry, allowlist attributes, disable default PII collection, and redact or tokenize sensitive fields before the SDK boundary; verify exporters with synthetic canary data.
      source: https://cwe.mitre.org/data/definitions/201.html
    pattern-sources:
      - patterns:
          - pattern: os.getenv($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
