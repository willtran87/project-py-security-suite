  - id: python.exception-detail-to-http-response
    languages: [python]
    message: A raw exception is exposed in an HTTP response and may disclose implementation or sensitive details.
    severity: ERROR
    metadata:
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      category: data-exposure
      confidence: HIGH
      impact: Exception text can reveal queries, filesystem paths, credentials, upstream responses, internal hostnames, or implementation details to an untrusted client.
      remediation: Return a stable public error code and generic message; retain the exception only in protected server-side diagnostics after redaction.
      source: https://cwe.mitre.org/data/definitions/209.html
    patterns:
      - pattern-inside: |
          try:
            ...
          except $TYPE as $ERROR:
            ...
      - pattern-either:
          - pattern: raise HTTPException(..., detail=str($ERROR), ...)
          - pattern: HTTPException(..., detail=str($ERROR), ...)
          - pattern: abort(..., description=str($ERROR), ...)
          - pattern: JsonResponse(..., str($ERROR), ...)
