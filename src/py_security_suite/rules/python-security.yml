  - id: python.request-data-to-log
    languages: [python]
    mode: taint
    message: An HTTP request payload or collection may reach a log sink without an explicit data-minimization boundary.
    severity: WARNING
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      category: data-exposure
      confidence: MEDIUM
      impact: Request bodies, forms, and parameter collections commonly contain credentials, tokens, personal data, and uploaded content; logging the collection can copy it into lower-trust, long-retained systems.
      remediation: Log an allowlisted event model instead of the request object or payload; exclude authentication material and apply tested, data-class-aware redaction before serialization.
      source: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    pattern-sources:
      - pattern: await $REQUEST.json(...)
      - pattern: $REQUEST.json(...)
      - pattern: $REQUEST.get_json(...)
      - patterns:
          - pattern-either:
              - pattern: $REQUEST.body
              - pattern: $REQUEST.data
              - pattern: $REQUEST.form
              - pattern: $REQUEST.POST
              - pattern: $REQUEST.GET
              - pattern: $REQUEST.query_params
          - metavariable-regex:
              metavariable: $REQUEST
              regex: (?i)^(?!.*response)(?:.*[._])?(?:req|request)$
    pattern-propagators:
      - pattern: $TO = $FROM
        from: $FROM
        to: $TO
    pattern-sanitizers:
      - patterns:
          - pattern: $SANITIZER(...)
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: (?i).*(?:allowlist|drop_sensitive|minimize|redact|remove_sensitive|sanitize|scrub).*
    pattern-sinks:
