  - id: config.opentelemetry-genai-content-capture-enabled
    languages: [generic]
    message: GenAI message-content capture is enabled; prompts, responses, tool arguments, and tool results require explicit data-governance approval.
    severity: INFO
    paths:
      include:
        - "**/.env"
        - "**/*.env"
        - "**/*.cfg"
        - "**/*.conf"
        - "**/*.ini"
        - "**/*.properties"
        - "**/*.toml"
        - "**/*.yaml"
        - "**/*.yml"
    metadata:
      cwe:
        - "CWE-201: Insertion of Sensitive Information Into Sent Data"
        - "CWE-359: Exposure of Private Personal Information to an Unauthorized Actor"
      category: data-exposure
      confidence: HIGH
      impact: Full GenAI content can contain credentials, personal data, proprietary material, retrieved documents, and tool inputs or outputs that cross telemetry trust and retention boundaries.
      remediation: Keep content capture disabled by default; when approved, minimize content, constrain exporters and retention, and verify redaction with synthetic canaries.
      source: https://opentelemetry.io/docs/security/handling-sensitive-data/
    pattern-regex: '(?mi)^\x{FEFF}?\s*["'']?OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT["'']?\s*(?:=|:)\s*["'']?(?:SPAN_ONLY|EVENT_ONLY|SPAN_AND_EVENT)["'']?\s*(?:#.*)?$'

  - id: config.opentelemetry-genai-content-capture-invalid-mode
    languages: [generic]
    message: GenAI message-content capture uses a legacy boolean-like value instead of a named content-capture mode.
    severity: WARNING
    paths:
      include:
        - "**/.env"
        - "**/*.env"
        - "**/*.cfg"
        - "**/*.conf"
        - "**/*.ini"
        - "**/*.properties"
        - "**/*.toml"
        - "**/*.yaml"
        - "**/*.yml"
    metadata:
      cwe:
        - "CWE-693: Protection Mechanism Failure"
      category: configuration
      confidence: HIGH
      impact: A boolean-like value can fail closed or change meaning across SDK versions, leaving operators with telemetry behavior that differs from the reviewed configuration.
      remediation: Replace the value with NO_CONTENT, SPAN_ONLY, EVENT_ONLY, or SPAN_AND_EVENT and document the intended data boundary.
      source: https://opentelemetry.io/docs/security/handling-sensitive-data/
    pattern-regex: '(?mi)^\x{FEFF}?\s*["'']?OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT["'']?\s*(?:=|:)\s*["'']?(?:true|false|yes|no|on|off|0|1)["'']?\s*(?:#.*)?$'

  - id: config.opentelemetry-broad-http-header-capture
    languages: [generic]
    message: Broad OpenTelemetry HTTP-header capture can export authorization, cookie, or other sensitive headers unless an effective sanitization policy is enforced.
    severity: WARNING
    paths:
      include:
        - "**/.env"
        - "**/*.env"
        - "**/*.cfg"
        - "**/*.conf"
        - "**/*.ini"
        - "**/*.properties"
        - "**/*.toml"
        - "**/*.yaml"
        - "**/*.yml"
    metadata:
      cwe:
        - "CWE-201: Insertion of Sensitive Information Into Sent Data"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      category: data-exposure
      confidence: HIGH
      impact: Wildcard header capture can copy credentials and private request metadata into telemetry backends with different access, residency, and retention controls.
      remediation: Replace wildcard capture with an explicit allowlist, configure sensitive-header sanitization, and verify exported spans with synthetic canary headers.
      source: https://opentelemetry.io/docs/security/handling-sensitive-data/
    pattern-regex: '(?mi)^\x{FEFF}?\s*["'']?OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_(?:SERVER_REQUEST|SERVER_RESPONSE|CLIENT_REQUEST|CLIENT_RESPONSE)["'']?\s*(?:=|:)\s*["'']?(?:\*|\.\*)["'']?\s*(?:#.*)?$'
