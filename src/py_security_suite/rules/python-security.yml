      remediation: Replace wildcard capture with an explicit allowlist, configure sensitive-header sanitization, and verify exported spans with synthetic canary headers.
      source: https://opentelemetry.io/docs/security/handling-sensitive-data/
    pattern-regex: '(?mi)^\x{FEFF}?\s*["'']?OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_(?:SERVER_REQUEST|SERVER_RESPONSE|CLIENT_REQUEST|CLIENT_RESPONSE)["'']?\s*(?:=|:)\s*["'']?(?:\*|\.\*)["'']?\s*(?:#.*)?$'

