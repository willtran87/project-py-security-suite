      - patterns:
          - pattern: $REQUEST.headers.get($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:authorization|cookie|credential|password|secret|session|token).*
      - pattern: $REQUEST.cookies.get(...)
      - patterns:
          - pattern: $OBJECT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?:api_key|auth_token|authorization|connection_string|cookie|credential|database_url|dsn|encryption_key|otp|passcode|password|passwd|pin|private_key|secret|session|token)$
      - patterns:
          - pattern-either:
              - pattern: $OBJECT[$KEY]
              - pattern: $OBJECT.get($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - pattern: $CLIENT.get_secret_value(...)
      - pattern: $CLIENT.access_secret_version(...)
    pattern-propagators:
      - pattern: $TO = $FROM
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: sentry_sdk.capture_message($DATA, ...)
              - pattern: sentry_sdk.capture_event($DATA, ...)
              - pattern: sentry_sdk.set_user($DATA, ...)
              - pattern: sentry_sdk.set_context(..., $DATA, ...)
              - pattern: sentry_sdk.set_extra(..., $DATA, ...)
              - pattern: sentry_sdk.add_breadcrumb(..., data=$DATA, ...)
              - pattern: $SCOPE.set_context(..., $DATA, ...)
              - pattern: $SCOPE.set_extra(..., $DATA, ...)
              - pattern: $SPAN.set_attribute(..., $DATA, ...)
              - pattern: $SPAN.set_attributes($DATA, ...)
              - pattern: $SPAN.add_event(..., attributes=$DATA, ...)
              - pattern: $SPAN.set_tag(..., $DATA, ...)
              - pattern: $METRIC.labels(..., $DATA, ...)
              - pattern: analytics.identify(..., $DATA, ...)
              - pattern: analytics.track(..., $DATA, ...)
              - pattern: mixpanel.track(..., $DATA, ...)
              - pattern: posthog.capture(..., properties=$DATA, ...)
              - pattern: newrelic.agent.record_custom_event(..., $DATA, ...)
              - pattern: rollbar.report_message(..., extra_data=$DATA, ...)
              - pattern: bugsnag.notify(..., metadata=$DATA, ...)
              - pattern: $SPAN.add_attribute(..., $DATA, ...)
              - pattern: $SPAN.put_annotation(..., $DATA, ...)
              - pattern: $SPAN.put_metadata(..., $DATA, ...)
              - pattern: $CLIENT.add_field(..., $DATA, ...)
              - pattern: $CLIENT.set_custom_context($DATA, ...)
              - pattern: $CLIENT.set_extra_context($DATA, ...)
              - pattern: $CLIENT.notice_error(..., custom_params=$DATA, ...)
          - focus-metavariable: $DATA

