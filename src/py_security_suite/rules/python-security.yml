  - id: python.sensitive-data-in-url-query
    languages: [python]
    mode: taint
    message: Credential-bearing data may be placed in an HTTP URL query string.
    severity: ERROR
    metadata:
      cwe:
        - "CWE-598: Use of HTTP Request With Sensitive Query String"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      category: data-exposure
      confidence: HIGH
      impact: URLs are routinely retained in browser history, access logs, proxies, monitoring systems, caches, and Referer headers; a query credential can therefore leak far beyond the intended recipient.
      remediation: Send credentials in an appropriate protected header or request body, never in the URL; rotate any exposed credential and review downstream logs and telemetry.
      source: https://cwe.mitre.org/data/definitions/598.html
    pattern-sources:
      - patterns:
          - pattern: os.getenv($KEY, ...)
          - metavariable-regex:
