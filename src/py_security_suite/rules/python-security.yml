  - id: python.request-to-path
    languages: [python]
    mode: taint
    message: Request-controlled data reaches a filesystem path.
    severity: ERROR
    metadata:
      cwe: [CWE-22]
      category: injection
      confidence: HIGH
      pysec_rule_id: python.request-to-path
      impact: Untrusted request data may cross a security boundary into a privileged operation.
      remediation: Map user choices to fixed paths or validate containment under a trusted directory after normalization.
      source: https://cwe.mitre.org/data/definitions/22.html
    pattern-sources:
      - pattern-either:
          - pattern: $REQUEST.args[$KEY]
          - pattern: $REQUEST.headers[$KEY]
          - pattern: $REQUEST.headers.get(...)
          - pattern: $REQUEST.cookies[$KEY]
          - pattern: $REQUEST.cookies.get(...)
          - pattern: $REQUEST.COOKIES[$KEY]
          - pattern: $REQUEST.COOKIES.get(...)
          - pattern: $REQUEST.META[$KEY]
          - pattern: $REQUEST.META.get(...)
          - pattern: $REQUEST.args.get(...)
          - pattern: $REQUEST.form[$KEY]
          - pattern: $REQUEST.form.get(...)
          - pattern: $REQUEST.GET[$KEY]
          - pattern: $REQUEST.GET.get(...)
          - pattern: $REQUEST.POST[$KEY]
          - pattern: $REQUEST.POST.get(...)
          - pattern: $REQUEST.query_params[$KEY]
          - pattern: $REQUEST.query_params.get(...)
          - pattern: $REQUEST.path_params[$KEY]
          - pattern: $REQUEST.path_params.get(...)
          - pattern: $REQUEST.get_json(...)
          - pattern: $REQUEST.json(...)
          - pattern: $REQUEST.data
          - pattern: $REQUEST.body
        exact: true
      - patterns:
          - pattern: |
              @$APP.$METHOD(...)
              def $FUNC(..., $PARAM: str, ...):
                ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:get|post|put|patch|delete|route|api_route)$
          - focus-metavariable: $PARAM
        exact: true
    pattern-propagators:
      # Preserve element flow only for identity and string-conversion list
      # comprehensions. Constant or sanitized bodies do not match these forms.
      - pattern: $OUTPUT = [$ITEM for $ITEM in $INPUT]
        from: $INPUT
        to: $OUTPUT
        by-side-effect: true
      - pattern: $OUTPUT = [str($ITEM) for $ITEM in $INPUT]
        from: $INPUT
        to: $OUTPUT
        by-side-effect: true
    pattern-sanitizers:
      # Only exclude the value occurrence in a branch whose condition the
      # native evaluator proves unreachable. This does not sanitize the
      # variable elsewhere or trust helper names. Unknown conditions stay tainted.
      - patterns:
          - pattern: $YES if $CONDITION else $NO
          - metavariable-comparison:
              metavariable: $CONDITION
              comparison: $CONDITION == True
          - focus-metavariable: $NO
        exact: true
      - patterns:
          - pattern: $YES if $CONDITION else $NO
          - metavariable-comparison:
              metavariable: $CONDITION
              comparison: $CONDITION == False
          - focus-metavariable: $YES
        exact: true
      - patterns:
          - pattern: |
              if $CONDITION:
                  ...
              else:
                  ...
                  $TARGET = $VALUE
                  ...
          - metavariable-comparison:
              metavariable: $CONDITION
              comparison: $CONDITION == True
          - focus-metavariable: $VALUE
        exact: true
      - patterns:
          - pattern: |
              if $CONDITION:
                  ...
                  $TARGET = $VALUE
                  ...
          - metavariable-comparison:
              metavariable: $CONDITION
              comparison: $CONDITION == False
          - focus-metavariable: $VALUE
        exact: true
      - pattern: werkzeug.utils.secure_filename(...)
        exact: true
      - patterns:
          - pattern: werkzeug.utils.secure_filename($INPUT)
          - metavariable-regex:
              metavariable: $INPUT
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
        exact: false
        # A name has no nested operation to hide. Semgrep's non-exact model
        # clears this argument occurrence as well as the safe return value,
        # while leaving other uses of the input variable tainted.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: open(..., file=$PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: flask.send_file($PATH, ...)
              - pattern: pathlib.Path($PATH).read_text(...)
              - pattern: pathlib.Path($PATH).read_bytes(...)
              - pattern: pathlib.Path($PATH).open(...)
          - focus-metavariable: $PATH

  - id: python.request-to-unsafe-html
    languages: [python]
    message: Request-controlled text is explicitly marked safe for HTML rendering.
    severity: ERROR
    metadata:
      pysec_rule_id: python.request-to-unsafe-html
      cwe: [CWE-79]
      category: injection
      confidence: HIGH
      remediation: Keep untrusted values subject to template autoescaping. Escape HTML text before constructing trusted markup; use a context-specific encoder for JavaScript, CSS, attributes and URLs.
      source: https://flask.palletsprojects.com/en/stable/web-security/
    # Direct request reads only. Do not infer unsafe string operations through
    # Markup values: concatenation and formatting can perform automatic escaping.
    pattern-either:
      - pattern: markupsafe.Markup(flask.request.args.get(...))
      - pattern: markupsafe.Markup(flask.request.args[$KEY])
      - pattern: markupsafe.Markup(flask.request.form.get(...))
      - pattern: markupsafe.Markup(flask.request.form[$KEY])
      - pattern: markupsafe.Markup(flask.request.headers.get(...))
      - pattern: markupsafe.Markup(flask.request.cookies.get(...))
      - pattern: django.utils.safestring.mark_safe(flask.request.args.get(...))
      - pattern: django.utils.safestring.mark_safe(flask.request.args[$KEY])
      - pattern: django.utils.safestring.mark_safe(flask.request.form.get(...))
      - pattern: django.utils.safestring.mark_safe(flask.request.form[$KEY])
      - pattern: django.utils.safestring.mark_safe(flask.request.headers.get(...))
      - pattern: django.utils.safestring.mark_safe(flask.request.cookies.get(...))

  - id: python.request-to-ldap
    languages: [python]
    mode: taint
    message: Request-controlled data reaches an LDAP search filter.
    severity: ERROR
    metadata:
      pysec_rule_id: python.request-to-ldap
      cwe: [CWE-90]
      category: injection
      confidence: MEDIUM
      remediation: Escape assertion values with ldap3.utils.conv.escape_filter_chars before constructing the filter. DN escaping and HTML escaping do not protect LDAP filters.
      source: https://ldap3.readthedocs.io/en/latest/searches.html
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.args[$KEY]
          - pattern: flask.request.form.get(...)
          - pattern: flask.request.form[$KEY]
          - pattern: flask.request.headers.get(...)
          - pattern: flask.request.cookies.get(...)
        exact: true
      # Enumerate single-argument reads separately so a surrounding request
      # lookup with a default does not hide an inner request source.
      - pattern-either:
          - pattern: flask.request.args.get($KEY)
          - pattern: flask.request.form.get($KEY)
          - pattern: flask.request.headers.get($KEY)
          - pattern: flask.request.cookies.get($KEY)
        exact: true
    pattern-sanitizers:
      - pattern: ldap3.utils.conv.escape_filter_chars(...)
        exact: true
      - patterns:
          - pattern: ldap3.utils.conv.escape_filter_chars($INPUT)
          - metavariable-regex:
              metavariable: $INPUT
              regex: ^[A-Za-z_][A-Za-z0-9_]*$
        exact: false
      # A literal-key lookup contains no nested operation to conceal. The
      # non-exact model clears only this encoder argument occurrence and return.
      - patterns:
          - pattern: ldap3.utils.conv.escape_filter_chars($INPUT)
          - metavariable-regex:
              metavariable: $INPUT
              regex: ^[A-Za-z_][A-Za-z0-9_.]*(?:\[\s*(?:"[^"\\]*"|'[^'\\]*')\s*\]|\(\s*(?:"[^"\\]*"|'[^'\\]*')\s*\))$
        exact: false
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              $CONNECTION = ldap3.Connection(...)
              $CONNECTION.search(...)
          - pattern-either:
              - pattern: $CONNECTION.search($BASE, $FILTER, ...)
              - pattern: $CONNECTION.search(..., search_filter=$FILTER, ...)
          - focus-metavariable: $FILTER
      - patterns:
          - pattern-either:
              - pattern: ldap3.Connection(...).search($BASE, $FILTER, ...)
              - pattern: ldap3.Connection(...).search(..., search_filter=$FILTER, ...)
          - focus-metavariable: $FILTER
