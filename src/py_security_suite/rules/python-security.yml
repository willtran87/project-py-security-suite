  - id: python.sensitive-data-in-url-query
    languages: [python]
    mode: taint
    message: Credential-bearing data may be placed in an HTTP URL query string.
    severity: ERROR
    metadata:
      cwe:
        - "CWE-598: Use of HTTP Request With Sensitive Query String"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      category: data-exposure
      confidence: HIGH
      impact: URLs are routinely retained in browser history, access logs, proxies, monitoring systems, caches, and Referer headers; a query credential can therefore leak far beyond the intended recipient.
      remediation: Send credentials in an appropriate protected header or request body, never in the URL; rotate any exposed credential and review downstream logs and telemetry.
      source: https://cwe.mitre.org/data/definitions/598.html
    pattern-sources:
      - patterns:
          - pattern: os.getenv($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - patterns:
          - pattern: os.environ[$KEY]
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:api.?key|auth(?:entication|orization|[_-]?(?:header|token))|connection.?string|cookie|credential|database.?url|dsn|encryption.?key|otp|passcode|password|passwd|pin|private.?key|secret|session|token).*
      - patterns:
          - pattern: $REQUEST.headers.get($KEY, ...)
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i).*(?:authorization|cookie|credential|password|secret|session|token).*
      - pattern: $REQUEST.cookies.get(...)
      - pattern: $CLIENT.get_secret_value(...)
      - pattern: $CLIENT.access_secret_version(...)
    pattern-propagators:
      - pattern: $TO = $FROM
        from: $FROM
        to: $TO
    pattern-sanitizers:
      - patterns:
          - pattern: $SANITIZER(...)
          - metavariable-regex:
              metavariable: $SANITIZER
              regex: (?i).*(?:allowlist|drop_sensitive|minimize|redact|remove_sensitive|sanitize|scrub).*
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD(..., params=$DATA, ...)
              - pattern: httpx.$METHOD(..., params=$DATA, ...)
              - pattern: $CLIENT.$METHOD(..., params=$DATA, ...)
          - focus-metavariable: $DATA
          - metavariable-regex:
              metavariable: $METHOD
              regex: (?:delete|get|head|options|patch|post|put|request)
      - patterns:
          - pattern-either:
              - pattern: urllib.parse.urlencode($DATA, ...)
              - pattern: urlencode($DATA, ...)
          - focus-metavariable: $DATA

