[mypy]
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
follow_imports = normal
ignore_missing_imports = True
no_site_packages = True
show_error_codes = True
disallow_any_generics = True
warn_return_any = True
# Optional native dependencies and platform-specific ctypes APIs expose
# different stubs on Linux, macOS, and Windows. Their narrow suppressions are
# validated by Ruff/Pyright; treating a platform-specific unused suppression as
# an error makes the same source non-portable across the supported CI matrix.
warn_unused_ignores = False
warn_redundant_casts = True
# Mypy constant-folds sys.platform for the host performing analysis. Both sides
# of those platform boundaries remain runtime-tested in the OS matrix.
warn_unreachable = False
strict_equality = True
warn_no_return = True
